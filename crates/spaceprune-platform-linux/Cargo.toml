[package]
name = "spaceprune-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux integration for SpacePrune"

[dependencies]
spaceprune-plugin-system-linux = { path = "../../plugins/system-linux" }
spaceprune-config = { path = "../spaceprune-config" }
spaceprune-plugin-api = { path = "../spaceprune-plugin-api" }
thiserror.workspace = true

[dev-dependencies]
spaceprune-access = { path = "../spaceprune-access" }
spaceprune-engine = { path = "../spaceprune-engine" }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[[test]]
name = "go_cache_policy"
path = "tests/go_cache_policy.rs"
harness = false
