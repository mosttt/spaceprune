[workspace]
members = [
    "crates/spaceprune-privileged-helper",
    "crates/spaceprune-readonly-protocol",
    "crates/spaceprune-windows-elevation",
    "crates/spaceprune-access",
    "crates/spaceprune",
    "crates/spaceprune-cli",
    "crates/spaceprune-config",
    "crates/spaceprune-contracts",
    "crates/spaceprune-engine",
    "crates/spaceprune-platform",
    "crates/spaceprune-platform-linux",
    "crates/spaceprune-plugin-api",
    "crates/spaceprune-plugin-host",
    "plugins/cross-platform/filesystem",
    "plugins/linux/system-linux",
    "plugins/cross-platform/developer-tools",
    "plugins/linux/snapper",
    "plugins/android/mobile-documents",
    "plugins/cross-platform/memory",
    "plugins/windows/system-windows",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
rustix = { version = "1.1.4", features = ["fs"] }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["string"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
globset = "0.4.20"
humantime = "2.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.27"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.4"
toml_edit = "0.25.13"
unicode-width = "0.2.2"
walkdir = "2.5.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# Component verification hashes large debug executables within the native startup budget.
[profile.dev.package.sha2]
opt-level = 3
