[package]
name = "spaceprune-plugin-snapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Snapper snapshot plugin for SpacePrune"

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
async-io = "2.6.0"
futures-lite = "2.6.1"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

spaceprune-access = { path = "../../crates/spaceprune-access" }
spaceprune-engine = { path = "../../crates/spaceprune-engine" }
spaceprune-plugin-api = { path = "../../crates/spaceprune-plugin-api" }
serde.workspace = true
serde_json.workspace = true
humantime.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
