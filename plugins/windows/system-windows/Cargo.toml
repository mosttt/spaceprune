[package]
name = "spaceprune-plugin-system-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows Shell recycle-bin and component-servicing lifecycle operations"

[dependencies]
serde.workspace = true
serde_json.workspace = true
spaceprune-plugin-api = { path = "../../../crates/spaceprune-plugin-api" }
spaceprune-engine = { path = "../../../crates/spaceprune-engine" }
spaceprune-access = { path = "../../../crates/spaceprune-access" }
spaceprune-windows-elevation = { path = "../../../crates/spaceprune-windows-elevation" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[dev-dependencies]
tempfile.workspace = true

[lints.rustdoc]
broken_intra_doc_links = "deny"
